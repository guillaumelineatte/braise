[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "braise-api"
version = "1.0.0"
description = "API de Braise — recettes de cuisine et administration."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "pillow>=10.3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP046 : on garde Generic[T] sur Page, sinon le nom du schéma OpenAPI change
ignore = ["E501", "B008", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
known-third-party = ["alembic"]
