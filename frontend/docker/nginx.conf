# Sert le build du front et relaie /api vers l'API : tout est sur le même domaine, pas de CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    client_max_body_size 13m; # images de 12 Mo max, + un peu de marge

    # les noms de fichiers contiennent un hash, on peut cacher longtemps
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://api:8000;
    }
    location = /robots.txt {
        proxy_pass http://api:8000;
    }

    # SPA : le reste renvoie index.html, sans cache
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
